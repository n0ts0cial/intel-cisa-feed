name: Check CISA Vulnerabilities

on:
  # Automated schedule: Runs every day at 03:00 AM UTC
  schedule:
    - cron: '0 3 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    # Required permissions for the GitHub Actions bot to write to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Vulnerability Script
        shell: pwsh
        run: |
          # Import and execute the script (ensure function call is at the end of the .ps1)
          . ./intel-cisa-feed.ps1

      - name: Commit and Push Report
        run: |
          # Configure GitHub Actions bot user identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the new files created in the reports directory
          git add reports/*.md
          
          # Commit only if there are changes (prevents errors when no new vulnerabilities are found)
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-generated vulnerability report for $(date +%F)"
            git push
          else
            echo "No changes to commit"
          fi
